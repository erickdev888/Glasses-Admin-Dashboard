  <text x="580" y="404" font-size="11.5" fill="#3a4c5a">usado por todas as telas</text>
  <g>
    <rect x="48" y="504" width="688" height="48" rx="8" fill="none" stroke="#6a7b88" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="392" y="532" text-anchor="middle" fill="#0c1a25">npm run build: esbuild junta src/ em dist/app.js e copia public/</text>
  </g>
