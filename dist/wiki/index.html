<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Wiki · Glasses Admin Dashboard</title>
  <meta name="description" content="Documentação do Glasses Admin Dashboard: como funciona, instalação, integrações, bibliotecas e guia para desenvolvedores.">
  <meta name="theme-color" content="#0b3d53">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --wall-1: #072a3b; --wall-2: #0f5a7a; --wall-3: #2a63ad;
      --chrome: rgba(6, 34, 50, .5); --chrome-line: rgba(255, 255, 255, .13);
      --on-chrome: #eef7fc; --on-chrome-2: rgba(226, 242, 251, .66);
      --card: rgba(255, 255, 255, .78); --card-line: rgba(255, 255, 255, .7);
      --ink: #0c1a25; --ink-2: #3a4c5a; --ink-3: #687a88; --line: rgba(12, 26, 37, .1);
      --well: rgba(13, 27, 38, .05); --accent: #1683c9;
      --shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 20px 50px -20px rgba(4, 30, 46, .5);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0; font-family: var(--font); color: var(--ink); line-height: 1.6; font-size: 15.5px;
      background: radial-gradient(1200px 700px at 10% -10%, #36b3d8 0%, transparent 60%),
                  radial-gradient(900px 700px at 100% 20%, #2457b8 0%, transparent 60%),
                  linear-gradient(160deg, var(--wall-1), var(--wall-2) 55%, var(--wall-3));
      background-attachment: fixed; min-height: 100vh;
    }
    a { color: var(--accent); }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
      padding: 14px 24px; background: var(--chrome); color: var(--on-chrome);
      backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-bottom: 1px solid var(--chrome-line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
    .brand small { display: block; font-weight: 500; font-size: 12px; color: var(--on-chrome-2); }
    .mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(180deg, #2aa3e6, #1683c9); box-shadow: 0 6px 18px -6px rgba(30, 150, 230, .8); }
    .spacer { flex: 1; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      color: var(--on-chrome); text-decoration: none; font-weight: 600; font-size: 14px;
      background: rgba(255, 255, 255, .12); border: 1px solid var(--chrome-line); white-space: nowrap; }
    .btn:hover { background: rgba(255, 255, 255, .2); }
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px; }
    .toc { position: sticky; top: 88px; align-self: start; max-height: calc(100vh - 112px); overflow: auto;
      padding: 16px; border-radius: 22px; background: var(--chrome); border: 1px solid var(--chrome-line);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .toc strong { display: block; color: var(--on-chrome-2); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 0 8px 8px; }
    .toc a { display: block; padding: 7px 10px; border-radius: 10px; color: var(--on-chrome); text-decoration: none; font-size: 14px; }
    .toc a:hover { background: rgba(255, 255, 255, .1); }
    .toc a.on { background: linear-gradient(180deg, #2aa3e6, #1683c9); }
    article { min-width: 0; padding: 36px 44px; border-radius: 30px; background: var(--card);
      border: 1px solid var(--card-line); box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(1.5); -webkit-backdrop-filter: blur(30px) saturate(1.5); }
    article h1 { font-size: 32px; letter-spacing: -.02em; line-height: 1.2; margin: 0 0 4px; }
    .meta { color: var(--ink-3); font-size: 14px; margin: 0 0 24px; }
    article h2 { font-size: 23px; letter-spacing: -.015em; margin: 44px 0 12px; padding-top: 20px; border-top: 1px solid var(--line); }
    article h2:first-of-type { border-top: 0; padding-top: 0; margin-top: 16px; }
    article p, article li { color: var(--ink-2); }
    article strong { color: var(--ink); }
    article ul, article ol { padding-left: 22px; }
    article li { margin: 4px 0; }
    code { font-family: var(--mono); font-size: .86em; background: var(--well); padding: 2px 6px; border-radius: 6px; color: var(--ink); }
    pre { background: #0d1b26; color: #e3eef6; padding: 16px 18px; border-radius: 16px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
    pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .table-wrap { overflow-x: auto; margin: 16px 0; border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, .55); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); background: var(--well); }
    tr:last-child td { border-bottom: 0; }
    img { max-width: 100%; height: auto; display: block; margin: 20px auto; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, .6); border: 1px solid var(--line); }
    .status { padding: 48px; text-align: center; color: var(--ink-3); }
    .foot { text-align: center; color: var(--on-chrome-2); font-size: 13px; padding: 8px 16px 32px; }
    .foot a { color: var(--on-chrome); }
    @media (max-width: 960px) {
      .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; }
      .toc { display: none; }
      article { padding: 24px 20px; border-radius: 22px; }
      article h1 { font-size: 26px; }
      .topbar { padding: 12px 16px; }
      .brand small { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l8 13 8-13 M8.5 6h7"/></svg></span>
      <div>Wiki<small>Glasses Admin Dashboard</small></div>
    </div>
    <span class="spacer"></span>
    <a class="btn" href="../">← Abrir o painel</a>
  </header>
  <div class="layout">
    <nav class="toc" aria-label="Seções da wiki"><strong>Nesta página</strong><div id="toc"></div></nav>
    <article id="content"><div class="status">Carregando a wiki…</div></article>
  </div>
  <footer class="foot">Código em <a href="https://github.com/erickdev888/Glasses-Admin-Dashboard">github.com/erickdev888/Glasses-Admin-Dashboard</a> · conteúdo em <code>public/wiki/wiki.md</code></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    (async () => {
      const box = document.getElementById('content');
      try {
        const res = await fetch('wiki.md', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        box.innerHTML = marked.parse(await res.text());
      } catch (e) {
        box.innerHTML = '<div class="status">Não foi possível carregar a wiki. Abra esta página por um servidor (start.bat ou GitHub Pages), não direto do disco.</div>';
        return;
      }
      const slug = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const h1 = box.querySelector('h1');
      if (h1) h1.insertAdjacentHTML('afterend', '<p class="meta">Documentação para desenvolvedores: como funciona, instalação, integrações e bibliotecas.</p>');
      box.querySelectorAll('table').forEach((t) => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
      box.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
      const toc = document.getElementById('toc');
      const heads = [...box.querySelectorAll('h2')];
      heads.forEach((h) => {
        h.id = slug(h.textContent);
        const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent; toc.appendChild(a);
      });
      // Link direto para uma seção (#...): rola de novo depois que a imagem do diagrama carregar
      const jump = () => { if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView(); };
      jump();
      box.querySelectorAll('img').forEach((img) => img.complete || img.addEventListener('load', jump, { once: true }));
      const links = [...toc.querySelectorAll('a')];
      const io = new IntersectionObserver((entries) => {
        entries.forEach((en) => { if (en.isIntersecting) links.forEach((l) => l.classList.toggle('on', l.hash === '#' + en.target.id)); });
      }, { rootMargin: '-90px 0px -70% 0px' });
      heads.forEach((h) => io.observe(h));
    })();
  </script>
</body>
</html>
